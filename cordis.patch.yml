# DSH profile patch: register the workbench as a loader entry.
# All paths are resolved at runtime by host.js; no absolute paths are stored here.
# The DSH host manages the workbench backend on port 8092 only.
# The account-pool process on port 38651 is managed by server/pool_service.py.
- insert:
    - id: image-workbench
      name: dsh-plugin-image-workbench
      config:
        port: 8092
        poolPort: 38651
        autoStart: true
        # 宿主侧守护：探测失败时自动重启后端，不重载面板。设为 false 并重启 DSH 可关闭。
        watchdog: true
        watchdogIntervalMs: 15000
